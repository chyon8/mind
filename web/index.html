<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Mind</title>
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --panel-2: #1c1c1c;
    --border: #2a2a2a;
    --text: #ededed;
    --muted: #8f8f8f;
    --accent: #ededed;
    --accent-ink: #0a0a0a;
    --link: #6ab0ff;
    --chip: #202020;
    --chip-on: #ededed;
    --chip-on-ink: #0a0a0a;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }
  input, textarea { font: inherit; color: inherit; }

  /* ---------- 로그인 ---------- */
  #login {
    max-width: 340px; margin: 18vh auto 0; padding: 0 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  #login h1 { font-size: 22px; margin: 0 0 8px; letter-spacing: -0.02em; }
  #login input {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; outline: none;
  }
  #login input:focus { border-color: #555; }
  #login button {
    background: var(--accent); color: var(--accent-ink); border: 0;
    border-radius: 10px; padding: 12px; font-weight: 600; margin-top: 4px;
  }
  .err { color: #ff6b6b; font-size: 13px; min-height: 16px; }

  /* ---------- 레이아웃 ---------- */
  #app { display: none; max-width: 900px; margin: 0 auto; padding: 20px 18px 80px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  header.top h1 { font-size: 18px; margin: 0; letter-spacing: -0.02em; }
  .ghost {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 6px 10px; font-size: 13px;
  }
  .ghost:hover { color: var(--text); border-color: #444; }

  /* ---------- 추가 폼 ---------- */
  .composer {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px; margin-bottom: 18px;
  }
  .composer textarea {
    width: 100%; background: transparent; border: 0; outline: none; resize: vertical;
    min-height: 62px; padding: 4px 4px 8px;
  }
  .composer .row {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin-top: 8px; flex-wrap: wrap;
  }
  .tagpick { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    background: var(--chip); border: 1px solid var(--border); color: var(--muted);
    border-radius: 999px; padding: 4px 11px; font-size: 13px; white-space: nowrap;
  }
  .chip.on { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  .composer button.add {
    background: var(--accent); color: var(--accent-ink); border: 0;
    border-radius: 9px; padding: 8px 18px; font-weight: 600;
  }
  .composer button.add:disabled { opacity: .4; cursor: default; }

  /* ---------- 필터 / 검색 ---------- */
  .controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  #search {
    width: 100%; background: var(--panel); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 13px; outline: none;
  }
  #search:focus { border-color: #555; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters .chip { cursor: pointer; }

  /* ---------- 카드 ---------- */
  .count { color: var(--muted); font-size: 12px; margin: 4px 2px 10px; }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 13px 14px; margin-bottom: 10px;
    position: relative;
  }
  .card .content { white-space: pre-wrap; word-break: break-word; }
  .card a.content { color: var(--link); text-decoration: none; }
  .card a.content:hover { text-decoration: underline; }
  .card .note {
    color: var(--muted); font-size: 13px; margin-top: 6px;
    border-left: 2px solid var(--border); padding-left: 8px; white-space: pre-wrap;
  }
  .card .meta {
    display: flex; align-items: center; gap: 8px; margin-top: 10px; flex-wrap: wrap;
    font-size: 12px; color: var(--muted);
  }
  .card .meta .ptag {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 9px; color: var(--text);
  }
  .card .copy {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 7px; padding: 3px 10px; font-size: 12px; margin-left: auto;
  }
  .card .copy:hover { color: var(--text); border-color: #444; }
  .card .copy.done { color: #4ade80; border-color: #2f5c3f; }
  .card { cursor: pointer; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }

  /* ---------- 상세 모달 ---------- */
  .modalBackdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6);
    z-index: 50; overflow-y: auto; padding: 40px 16px;
  }
  .modalBackdrop.open { display: block; }
  .modalPanel {
    background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
    max-width: 560px; width: 100%; margin: 0 auto; padding: 20px;
  }
  .modalHeader { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .modalHeader .meta { color: var(--muted); font-size: 12px; }
  .detailImg { width: 100%; border-radius: 10px; margin-bottom: 12px; display: block; }
  .detailLinkTitle { font-weight: 600; margin-bottom: 4px; }
  .detailOpen { display: inline-block; color: var(--link); text-decoration: none; font-size: 13px; margin-bottom: 10px; }
  .detailField {
    width: 100%; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; outline: none; resize: vertical; min-height: 60px; margin-bottom: 6px;
  }
  .detailField:focus { border-color: #555; }
  .detailLabel { color: var(--muted); font-size: 12px; margin: 14px 0 6px; }
  .detailRow { display: flex; gap: 6px; flex-wrap: wrap; }
  .detailBtn {
    background: var(--chip); border: 1px solid var(--border); color: var(--muted);
    border-radius: 8px; padding: 6px 12px; font-size: 13px;
  }
  .detailBtn.on { background: var(--chip-on); color: var(--chip-on-ink); border-color: var(--chip-on); }
  .detailBtn.danger { color: #ff6b6b; }
  .detailBtn.disabled { opacity: .4; }
  .detailActions {
    display: flex; justify-content: space-between; margin-top: 20px; padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .piece { border-left: 2px solid var(--border); padding-left: 8px; margin-bottom: 8px; font-size: 13px; color: var(--muted); }

  /* ---------- 사이드바 ---------- */
  .layout { display: flex; gap: 28px; align-items: flex-start; transition: gap .15s ease; }
  .sidebar {
    width: 104px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px;
    position: sticky; top: 20px; overflow: hidden;
    transition: width .15s ease, opacity .15s ease;
  }
  .layout.collapsed { gap: 0; }
  .layout.collapsed .sidebar { width: 0; opacity: 0; pointer-events: none; }
  .navBtn {
    background: none; border: 0; text-align: left; color: var(--muted);
    border-radius: 8px; padding: 8px 10px; font-size: 14px; white-space: nowrap;
  }
  .navBtn:hover { color: var(--text); }
  .navBtn.on { background: var(--panel); color: var(--text); font-weight: 600; }
  .main { flex: 1; min-width: 0; }
  .hidden { display: none !important; }
  .sidebarToggle { font-size: 15px; line-height: 1; padding: 6px 9px; }

  /* ---------- 헤매기 ---------- */
  .filters .chip.off { opacity: .45; text-decoration: line-through; }
  .filterHint { color: var(--muted); font-size: 12px; margin: 8px 0 14px; }
  .end { color: var(--muted); font-size: 12px; text-align: center; padding: 20px 0; }

  /* ---------- 발견 ---------- */
  .histRow {
    display: flex; align-items: center; gap: 10px; padding: 10px 2px;
    border-bottom: 1px solid var(--border);
  }
  .histMain { flex: 1; min-width: 0; cursor: pointer; }
  .histMeta { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
  .pushBadge {
    border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px;
    font-size: 11px; color: var(--muted);
  }
  .histDate { color: var(--muted); font-size: 12px; }
  .histTitle { font-size: 14px; }
  .histDel {
    background: none; border: 1px solid var(--border); color: var(--muted);
    border-radius: 7px; padding: 4px 10px; font-size: 12px; flex-shrink: 0;
  }
  .histDel:hover { color: #ff6b6b; border-color: #5c2f2f; }
  .dCard {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px;
  }
  .slotBadge { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .slotBadge.idea { color: var(--text); font-weight: 600; }
  .dCardTitle { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .dCardBody { color: var(--text); font-size: 14px; line-height: 1.6; }
  .dCardBody p { margin: 0 0 10px; }
  .dCardBody p:last-child { margin-bottom: 0; }
  .dCardBody ul, .dCardBody ol { margin: 0 0 10px; padding-left: 20px; }
  .dCardBody a { color: var(--link); }
  .dCardBody code { background: var(--panel-2); border-radius: 4px; padding: 1px 5px; font-size: 13px; }
  .dCardBody pre { background: var(--panel-2); border-radius: 8px; padding: 10px; overflow-x: auto; }
  .footnote { color: var(--muted); font-size: 13px; font-style: italic; margin-bottom: 10px; }
</style>
</head>
<body>

<div id="login">
  <h1>Mind</h1>
  <input id="email" type="email" placeholder="이메일" autocomplete="username" />
  <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" />
  <div class="err" id="loginErr"></div>
  <button id="loginBtn">로그인</button>
</div>

<div id="app">
  <header class="top">
    <div style="display: flex; align-items: center; gap: 10px;">
      <button class="ghost sidebarToggle" id="sidebarToggle" title="사이드바 토글">☰</button>
      <h1>Mind</h1>
    </div>
    <button class="ghost" id="logoutBtn">로그아웃</button>
  </header>

  <div class="layout" id="layout">
    <nav class="sidebar" id="sidebar">
      <button class="navBtn on" data-view="fragments">파편</button>
      <button class="navBtn" data-view="wander">헤매기</button>
      <button class="navBtn" data-view="discovery">발견</button>
    </nav>

    <div class="main">
      <div id="fragmentsView">
        <div class="composer">
          <textarea id="newContent" placeholder="파편을 남겨…"></textarea>
          <div class="tagpick" id="composerTags"></div>
          <div class="row">
            <span class="err" id="addErr"></span>
            <button class="add" id="addBtn">추가</button>
          </div>
        </div>

        <div class="controls">
          <input id="search" type="search" placeholder="검색…" />
          <div class="filters" id="filters"></div>
        </div>

        <div class="count" id="count"></div>
        <div id="list"></div>
      </div>

      <div id="wanderView" class="hidden">
        <div class="filters" id="wanderFilters"></div>
        <div class="filterHint">프로젝트를 우클릭하면 전체에서 뺀다</div>
        <div id="wanderList"></div>
        <div class="end hidden" id="wanderEnd">여기까지</div>
      </div>

      <div id="discoveryView" class="hidden">
        <div id="discoveryHome">
          <div id="discoveryList"></div>
        </div>
        <div id="discoveryResult" class="hidden">
          <button class="ghost" id="discoveryBack" style="margin-bottom: 14px;">‹ 목록</button>
          <div id="discoveryCards"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modalBackdrop" id="detailBackdrop">
  <div class="modalPanel" id="detailPanel"></div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://ibqyqpmwqujcxlnkyizf.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlicXlxcG13cXVqY3hsbmt5aXpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM5MzU4MDQsImV4cCI6MjA5OTUxMTgwNH0._cdX8OpSAZaPVhJdWgVVhXeu5yrKKkaBWgbx4LZkf9Q';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };

// ---------- 상태 ----------
let projects = [];              // {id, name}
let selectedTags = new Set();   // 추가 폼에서 고른 프로젝트 id
let filter = 'all';             // 'all' | 'inbox' | 프로젝트 id
let searchTerm = '';

// ---------- 인증 ----------
$('loginBtn').onclick = async () => {
  $('loginErr').textContent = '';
  const email = $('email').value.trim();
  const password = $('password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { $('loginErr').textContent = '로그인 실패 — 이메일/비밀번호 확인'; return; }
  boot();
};
$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });

$('logoutBtn').onclick = async () => { await sb.auth.signOut(); location.reload(); };

// ---------- 데이터 ----------
const isUrl = (s) => /^https?:\/\/\S+$/i.test(s.trim());

async function loadProjects() {
  const { data, error } = await sb.from('projects').select('id, name').order('created_at');
  if (error) throw error;
  projects = data;
}

async function loadFragments() {
  let rows;
  if (searchTerm) {
    const q = searchTerm.replace(/[%_]/g, '\\$&');
    const { data, error } = await sb.from('fragments')
      .select('*, fragment_projects(project_id)')
      .eq('archived', false)
      .or(`content.ilike.%${q}%,link_title.ilike.%${q}%,note.ilike.%${q}%`)
      .order('created_at', { ascending: false })
      .limit(200);
    if (error) throw error;
    rows = data;
  } else if (filter === 'all' || filter === 'inbox') {
    const { data, error } = await sb.from('fragments')
      .select('*, fragment_projects(project_id)')
      .eq('archived', false)
      .order('created_at', { ascending: false })
      .limit(300);
    if (error) throw error;
    rows = filter === 'inbox'
      ? data.filter((r) => (r.fragment_projects ?? []).length === 0)
      : data;
  } else {
    const { data, error } = await sb.from('fragments')
      .select('*, fragment_projects!inner(project_id)')
      .eq('fragment_projects.project_id', filter)
      .eq('archived', false)
      .order('created_at', { ascending: false })
      .limit(300);
    if (error) throw error;
    rows = data;
  }
  return rows.map((r) => ({ ...r, project_ids: (r.fragment_projects ?? []).map((m) => m.project_id) }));
}

async function addFragment() {
  const content = $('newContent').value.trim();
  if (!content) return;
  $('addErr').textContent = '';
  $('addBtn').disabled = true;
  try {
    const type = isUrl(content) ? 'link' : 'text';
    const { data, error } = await sb.from('fragments').insert({ content, type }).select('id').single();
    if (error) throw error;
    const ids = [...selectedTags];
    if (ids.length) {
      const { error: e2 } = await sb.from('fragment_projects')
        .insert(ids.map((project_id) => ({ fragment_id: data.id, project_id })));
      if (e2) throw e2;
    }
    $('newContent').value = '';
    selectedTags.clear();
    renderComposerTags();
    await refresh();
  } catch (e) {
    $('addErr').textContent = '추가 실패: ' + (e.message ?? e);
  } finally {
    $('addBtn').disabled = false;
  }
}
$('addBtn').onclick = addFragment;
$('newContent').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addFragment(); }
});

// ---------- 렌더 ----------
function renderComposerTags() {
  const box = $('composerTags');
  box.innerHTML = '';
  for (const p of projects) {
    const c = el('button', 'chip' + (selectedTags.has(p.id) ? ' on' : ''));
    c.textContent = p.name;
    c.onclick = () => {
      selectedTags.has(p.id) ? selectedTags.delete(p.id) : selectedTags.add(p.id);
      renderComposerTags();
    };
    box.appendChild(c);
  }
}

function renderFilters() {
  const box = $('filters');
  box.innerHTML = '';
  const mk = (key, label) => {
    const c = el('button', 'chip' + (filter === key ? ' on' : ''));
    c.textContent = label;
    c.onclick = () => { filter = key; searchTerm = ''; $('search').value = ''; refresh(); };
    box.appendChild(c);
  };
  mk('all', '전체');
  mk('inbox', 'Inbox');
  for (const p of projects) mk(p.id, p.name);
}

const projName = (id) => projects.find((p) => p.id === id)?.name ?? '';

function fmtDate(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}.${String(d.getMonth() + 1).padStart(2, '0')}.${String(d.getDate()).padStart(2, '0')}`;
}

// 파편 카드 하나 — 리스트와 헤매기가 같이 쓴다.
function fragmentCardEl(f) {
  const card = el('div', 'card');

  if (f.type === 'link') {
    const a = el('a', 'content');
    a.href = f.content; a.target = '_blank'; a.rel = 'noreferrer';
    a.textContent = f.link_title || f.content;
    card.appendChild(a);
  } else {
    const c = el('div', 'content');
    c.textContent = f.content;
    card.appendChild(c);
  }

  if (f.note) {
    const n = el('div', 'note');
    n.textContent = f.note;
    card.appendChild(n);
  }

  const meta = el('div', 'meta');
  const date = el('span'); date.textContent = fmtDate(f.created_at);
  meta.appendChild(date);
  for (const pid of f.project_ids) {
    const t = el('span', 'ptag'); t.textContent = projName(pid);
    if (t.textContent) meta.appendChild(t);
  }
  const copy = el('button', 'copy'); copy.textContent = '복사';
  copy.onclick = async (e) => {
    e.stopPropagation();
    await navigator.clipboard.writeText(f.content);
    copy.textContent = '복사됨'; copy.classList.add('done');
    setTimeout(() => { copy.textContent = '복사'; copy.classList.remove('done'); }, 1200);
  };
  meta.appendChild(copy);
  card.appendChild(meta);

  card.onclick = () => openDetail(f);
  return card;
}

function renderList(frs) {
  const list = $('list');
  list.innerHTML = '';
  $('count').textContent = frs.length ? `${frs.length}개` : '';
  if (!frs.length) {
    const e = el('div', 'empty');
    e.textContent = searchTerm ? '검색 결과 없음' : '아직 파편이 없어';
    list.appendChild(e);
    return;
  }
  for (const f of frs) list.appendChild(fragmentCardEl(f));
}

// ---------- 상세 모달 (수정 / 묻기·파내기 / 삭제) ----------
let detailFragment = null; // 열려 있는 파편의 로컬 사본

function closeDetail() {
  $('detailBackdrop').classList.remove('open');
  detailFragment = null;
}
$('detailBackdrop').addEventListener('click', (e) => {
  if (e.target.id === 'detailBackdrop') closeDetail();
});

function openDetail(f) {
  detailFragment = f;
  $('detailBackdrop').classList.add('open');
  renderDetail();
}

function renderDetail() {
  const f = detailFragment;
  const panel = $('detailPanel');
  panel.innerHTML = '';

  const header = el('div', 'modalHeader');
  const meta = el('span', 'meta');
  meta.textContent = `${f.type.toUpperCase()} · ${fmtDate(f.created_at)}`;
  const close = el('button', 'ghost'); close.textContent = '닫기';
  close.onclick = closeDetail;
  header.append(meta, close);
  panel.appendChild(header);

  if (f.image_path) {
    const img = el('img', 'detailImg');
    panel.appendChild(img);
    sb.storage.from('images').createSignedUrl(f.image_path, 60 * 60 * 24 * 7)
      .then(({ data }) => { if (data) img.src = data.signedUrl; });
  }

  if (f.type === 'link' && f.link_title) {
    const t = el('div', 'detailLinkTitle');
    t.textContent = f.link_title;
    panel.appendChild(t);
  }

  const contentField = el('textarea', 'detailField');
  contentField.value = f.content;
  contentField.placeholder = f.type === 'image' ? '캡션 (선택)' : '원문…';
  contentField.addEventListener('blur', () => saveDetailField('content', contentField.value));
  panel.appendChild(contentField);

  if (f.type === 'link') {
    const open = el('a', 'detailOpen');
    open.href = f.content; open.target = '_blank'; open.rel = 'noreferrer';
    open.textContent = '열기 ↗';
    panel.appendChild(open);
  }

  const noteLabel = el('div', 'detailLabel'); noteLabel.textContent = '덧붙임';
  panel.appendChild(noteLabel);
  const noteField = el('textarea', 'detailField');
  noteField.value = f.note || '';
  noteField.placeholder = '이 파편에 대한 생각을 덧붙여…';
  noteField.addEventListener('blur', () =>
    saveDetailField('note', noteField.value.trim() === '' ? null : noteField.value));
  panel.appendChild(noteField);

  if (f.merged_from && f.merged_from.length) {
    const mLabel = el('div', 'detailLabel');
    mLabel.textContent = `합쳐진 조각 (${f.merged_from.length})`;
    panel.appendChild(mLabel);
    for (const piece of f.merged_from) {
      const p = el('div', 'piece');
      p.textContent = `${fmtDate(piece.created_at)} — ${(piece.content || '').slice(0, 80)}`;
      panel.appendChild(p);
    }
  }

  const tierLabel = el('div', 'detailLabel'); tierLabel.textContent = 'TIER';
  panel.appendChild(tierLabel);
  const tierRow = el('div', 'detailRow');
  for (const [value, label] of [['normal', '보통'], ['important', '중요'], ['pinned', '고정']]) {
    const b = el('button', 'detailBtn' + (f.tier === value ? ' on' : ''));
    b.textContent = label;
    b.onclick = () => setDetailTier(value);
    tierRow.appendChild(b);
  }
  panel.appendChild(tierRow);

  const projLabel = el('div', 'detailLabel'); projLabel.textContent = 'PROJECT';
  panel.appendChild(projLabel);
  const projRow = el('div', 'detailRow');
  for (const p of projects) {
    const on = f.project_ids.includes(p.id);
    const b = el('button', 'detailBtn' + (on ? ' on' : ''));
    b.textContent = p.name;
    b.onclick = () => toggleDetailProject(p.id);
    projRow.appendChild(b);
  }
  panel.appendChild(projRow);

  // 고정한 걸 실수로 묻지 않게 — 묻으려면 먼저 고정을 풀어야 한다 (앱과 동일 규칙)
  const pinnedBlocksGrave = f.tier === 'pinned' && !f.archived;
  const actions = el('div', 'detailActions');
  const archiveBtn = el('button', 'detailBtn' + (pinnedBlocksGrave ? ' disabled' : ''));
  archiveBtn.textContent = f.archived
    ? '파내기 — 타임라인으로 복귀'
    : pinnedBlocksGrave ? '묻기 — 고정을 먼저 풀어야 한다' : '묻기 — 무덤으로';
  archiveBtn.onclick = () => { if (!pinnedBlocksGrave) toggleDetailArchive(); };
  const deleteBtn = el('button', 'detailBtn danger'); deleteBtn.textContent = '삭제';
  deleteBtn.onclick = deleteDetailFragment;
  actions.append(archiveBtn, deleteBtn);
  panel.appendChild(actions);
}

async function saveDetailField(field, value) {
  const f = detailFragment;
  if (!f || value === f[field]) return;
  const { error } = await sb.from('fragments').update({ [field]: value }).eq('id', f.id);
  if (error) { alert('저장 실패: ' + error.message); return; }
  f[field] = value;
  await refresh();
}

async function setDetailTier(value) {
  const f = detailFragment;
  if (value === f.tier) return;
  const { error } = await sb.from('fragments').update({ tier: value }).eq('id', f.id);
  if (error) { alert('저장 실패: ' + error.message); return; }
  f.tier = value;
  renderDetail();
  await refresh();
}

async function toggleDetailProject(projectId) {
  const f = detailFragment;
  const next = f.project_ids.includes(projectId)
    ? f.project_ids.filter((id) => id !== projectId)
    : [...f.project_ids, projectId];
  const { error: delError } = await sb.from('fragment_projects').delete().eq('fragment_id', f.id);
  if (delError) { alert('저장 실패: ' + delError.message); return; }
  if (next.length) {
    const { error } = await sb.from('fragment_projects')
      .insert(next.map((project_id) => ({ fragment_id: f.id, project_id })));
    if (error) { alert('저장 실패: ' + error.message); return; }
  }
  f.project_ids = next;
  renderDetail();
  await refresh();
}

async function toggleDetailArchive() {
  const f = detailFragment;
  const next = !f.archived;
  const { error } = await sb.from('fragments').update({ archived: next }).eq('id', f.id);
  if (error) { alert('저장 실패: ' + error.message); return; }
  f.archived = next;
  renderDetail();
  await refresh();
}

async function deleteDetailFragment() {
  const f = detailFragment;
  if (!confirm('삭제할까? 되돌릴 수 없다.')) return;
  if (f.image_path) {
    await sb.storage.from('images').remove([f.image_path]);
  }
  const { error } = await sb.from('fragments').delete().eq('id', f.id);
  if (error) { alert('삭제 실패: ' + error.message); return; }
  closeDetail();
  await refresh();
}

let currentView = 'fragments';

document.querySelectorAll('.navBtn').forEach((btn) => {

const SIDEBAR_KEY = 'sidebar.collapsed';

}
$('sidebarToggle').onclick = () => setSidebarCollapsed(!$('layout').classList.contains('collapsed'));
setSidebarCollapsed(localStorage.getItem(SIDEBAR_KEY) === '1');

// ---------- 선명도 (lib/vividness.ts 그대로 포팅) ----------
const DECAY = { normal: [1, 7], important: [7, 21] };
const FLOOR_OPACITY = 0.15;
const MS_PER_DAY = 86_400_000;

function effectiveTier(tier, touchCount) {
  if (tier !== 'normal') return tier;
  return touchCount >= 2 ? 'important' : 'normal';
}

function vividness(fr, now = new Date()) {
  const tier = effectiveTier(fr.tier, fr.touch_count);
  if (tier === 'pinned') return 1;
  const days = Math.max(0, (now.getTime() - new Date(fr.last_touched_at).getTime()) / MS_PER_DAY);
  const [start, floor] = DECAY[tier];
  if (days <= start) return 1;
  if (days >= floor) return FLOOR_OPACITY;
  return 1 - (1 - FLOOR_OPACITY) * ((days - start) / (floor - start));
}

// ---------- 헤매기 (앱 wander.tsx 포팅 — 판단 버튼 없음, 한 바퀴로 끝난다) ----------
const WANDER_CHUNK = 8;
const WANDER_READABLE_FLOOR = 0.55;
const WANDER_EXCLUDE_KEY = 'wander.excluded';

let wanderFilter = 'all';
let wanderExcluded = new Set(JSON.parse(localStorage.getItem(WANDER_EXCLUDE_KEY) || '[]'));
let wanderPool = [];
let wanderDeck = [];
let wanderItems = [];
let wanderLoading = false;
let wanderStarted = false;

function shuffle(ids) {
  const out = [...ids];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

async function loadWanderIndex(filter) {
  const cols = 'id, created_at, last_touched_at, tier, touch_count';
  let q;
  if (filter !== 'all' && filter !== 'inbox') {
    q = sb.from('fragments')
      .select(`${cols}, fragment_projects!inner(project_id)`)
      .eq('fragment_projects.project_id', filter)
      .eq('archived', false);
  } else {
    q = sb.from('fragments').select(`${cols}, fragment_projects(project_id)`).eq('archived', false);
    if (filter === 'inbox') q = q.is('fragment_projects', null);
  }
  const { data, error } = await q.order('created_at', { ascending: false });
  if (error) throw error;
  return data.map(({ fragment_projects, ...rest }) => ({
    ...rest,
    project_ids: (fragment_projects ?? []).map((m) => m.project_id),
  }));
}

// 우클릭 = 앱의 "칩 길게 누르기"에 대응 (데스크톱 웹이라 길게 누르기 대신 컨텍스트메뉴로 대체)
function toggleWanderExclude(projectId) {
  if (wanderExcluded.has(projectId)) wanderExcluded.delete(projectId);
  else wanderExcluded.add(projectId);
  localStorage.setItem(WANDER_EXCLUDE_KEY, JSON.stringify([...wanderExcluded]));
  if (wanderFilter === 'all') startWander();
  else renderWanderFilters();
}

function renderWanderFilters() {
  const box = $('wanderFilters');
  box.innerHTML = '';
  const mk = (key, label, isProject) => {
    const c = el('button', 'chip' + (wanderFilter === key ? ' on' : '') + (isProject && wanderExcluded.has(key) ? ' off' : ''));
    c.textContent = label;
    c.onclick = () => { if (wanderFilter !== key) { wanderFilter = key; startWander(); } };
    if (isProject) c.oncontextmenu = (e) => { e.preventDefault(); toggleWanderExclude(key); };
    box.appendChild(c);
  };
  mk('all', '전체', false);
  mk('inbox', 'Inbox', false);
  for (const p of projects) mk(p.id, p.name, true);
}

async function startWander() {
  wanderPool = []; wanderDeck = []; wanderItems = []; wanderLoading = false;
  renderWanderFilters();
  $('wanderList').innerHTML = '<div class="empty">불러오는 중…</div>';
  $('wanderEnd').classList.add('hidden');
  try {
    const index = await loadWanderIndex(wanderFilter);
    const kept = wanderFilter === 'all' && wanderExcluded.size > 0
      ? index.filter((m) => !(m.project_ids ?? []).some((id) => wanderExcluded.has(id)))
      : index;
    wanderPool = kept.map((m) => m.id);
    wanderDeck = shuffle(wanderPool);
    $('wanderList').innerHTML = '';
    if (wanderPool.length === 0) {
      $('wanderList').innerHTML = '<div class="empty">헤맬 것이 아직 없다</div>';
      return;
    }
    await moreWander();
  } catch (e) {
    $('wanderList').innerHTML = `<div class="empty">불러오기 실패: ${e.message ?? e}</div>`;
  }
}

async function moreWander() {
  if (wanderLoading || currentView !== 'wander') return;
  if (wanderDeck.length === 0) {
    if (wanderItems.length > 0) $('wanderEnd').classList.remove('hidden');
    return;
  }
  wanderLoading = true;
  try {
    const ids = wanderDeck.splice(0, Math.min(WANDER_CHUNK, wanderDeck.length));
    const { data, error } = await sb.from('fragments')
      .select('*, fragment_projects(project_id)')
      .in('id', ids);
    if (error) throw error;
    const byId = new Map(data.map((r) => [r.id, { ...r, project_ids: (r.fragment_projects ?? []).map((m) => m.project_id) }]));
    wanderItems.push(...ids.map((id) => byId.get(id)).filter(Boolean));
    renderWanderList();
    if (wanderDeck.length === 0) $('wanderEnd').classList.remove('hidden');
  } catch {
    // 한 번 실패해도 다음 스크롤에서 다시 시도
  } finally {
    wanderLoading = false;
  }
}

function renderWanderList() {
  const box = $('wanderList');
  box.innerHTML = '';
  for (const f of wanderItems) {
    const card = fragmentCardEl(f);
    card.style.opacity = Math.max(vividness(f), WANDER_READABLE_FLOOR);
    box.appendChild(card);
  }
}

window.addEventListener('scroll', () => {
  if (currentView === 'wander' && window.innerHeight + window.scrollY >= document.body.offsetHeight - 400) {
    moreWander();
  }
});

// ---------- 발견 (앱 discovery.tsx 포팅 — 읽기 전용: 던지기는 안 붙였다) ----------
let discoveryList = [];
let discoveryStarted = false;

const SLOT_RE = /^\[([^\]]{1,10})\]\s*(.*)$/;
const REJECT_RE = /(뺐|뺀\s|제외|리스티클|못 찾|버린\s*것|안 넣)/;

function parseCards(md) {
  const cards = [];
  let cur = null;
  for (const ln of md.split('\n')) {
    const h = ln.match(/^###\s+(.+)/);
    if (h) {
      const m = h[1].trim().match(SLOT_RE);
      cur = { title: (m ? m[2] : h[1]).trim(), slot: m ? m[1].trim() : '', body: '' };
      cards.push(cur);
    } else if (ln.trimStart().startsWith('※')) {
      cards.push({ title: '', slot: '', body: ln.replace(/^\s*※\s*/, '').trim() });
      cur = null;
    } else if (cur) {
      cur.body += (cur.body ? '\n' : '') + ln;
    } else if (ln.trim()) {
      cards.push({ title: '', slot: '', body: ln });
    }
  }
  const last = [...cards].reverse().find((c) => c.title);
  if (last) {
    const paras = last.body.split(/\n{2,}/);
    const tail = paras[paras.length - 1] ?? '';
    if (paras.length > 1 && REJECT_RE.test(tail) && tail.length < 220) {
      paras.pop();
      last.body = paras.join('\n\n');
      cards.push({ title: '', slot: '', body: tail.trim() });
    }
  }
  return cards.map((c) => ({ ...c, body: c.body.trim() })).filter((c) => c.title || c.body);
}

const firstTitle = (md) => parseCards(md).find((c) => c.title)?.title ?? '(제목 없음)';
const formatCost = (usd) => (usd == null ? '' : `$${usd.toFixed(2)}`);

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function mdInlineToHtml(s) {
  s = escapeHtml(s);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_m, text, href) =>
    /^https?:\/\//i.test(href) ? `<a href="${href}" target="_blank" rel="noreferrer">${text}</a>` : text);
  return s;
}

// 마크다운 부분집합만 지원(굵게·목록·링크·코드) — RN 파서(lib/markdown.tsx)와 같은 문법 범위
function mdToHtml(src) {
  let html = '';
  let para = [];
  let listType = null;
  let inCode = false;
  let codeLines = [];
  const flushPara = () => { if (para.length) { html += `<p>${mdInlineToHtml(para.join(' '))}</p>`; para = []; } };
  const closeList = () => { if (listType) { html += `</${listType}>`; listType = null; } };

  for (const line of src.split('\n')) {
    if (inCode) {
      if (line.startsWith('```')) { html += `<pre>${escapeHtml(codeLines.join('\n'))}</pre>`; inCode = false; codeLines = []; }
      else codeLines.push(line);
      continue;
    }
    if (line.startsWith('```')) { flushPara(); closeList(); inCode = true; continue; }
    const b = line.match(/^\s*[-*•]\s+(.*)/);
    const o = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (b) { flushPara(); if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; } html += `<li>${mdInlineToHtml(b[1])}</li>`; }
    else if (o) { flushPara(); if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; } html += `<li>${mdInlineToHtml(o[1])}</li>`; }
    else if (!line.trim()) { flushPara(); closeList(); }
    else para.push(line);
  }
  flushPara(); closeList();
  if (inCode) html += `<pre>${escapeHtml(codeLines.join('\n'))}</pre>`;
  return html;
}

async function loadDiscoveryList() {
  const { data, error } = await sb.schema('rudy').from('utterances')
    .select('id, created_at, text, trigger, cost_usd')
    .eq('kind', 'discovery')
    .eq('surface', 'briefing')
    .not('text', 'is', null)
    .order('created_at', { ascending: false })
    .limit(60);
  if (error) throw error;
  discoveryList = (data ?? []).filter((b) => (b.text ?? '').trim());
}

function renderDiscoveryHome() {
  const box = $('discoveryList');
  box.innerHTML = '';
  if (discoveryList.length === 0) {
    box.innerHTML = '<div class="empty">아직 기록이 없다</div>';
    return;
  }
  for (const b of discoveryList) {
    const row = el('div', 'histRow');
    const main = el('div', 'histMain');
    main.onclick = () => openDiscovery(b);

    const metaRow = el('div', 'histMeta');
    if (b.trigger === 'push') {
      const badge = el('span', 'pushBadge'); badge.textContent = '아침';
      metaRow.appendChild(badge);
    }
    const date = el('span', 'histDate');
    date.textContent = `${fmtDate(b.created_at)}${b.cost_usd != null ? ' · ' + formatCost(b.cost_usd) : ''}`;
    metaRow.appendChild(date);
    main.appendChild(metaRow);

    const title = el('div', 'histTitle');
    title.textContent = firstTitle(b.text);
    main.appendChild(title);

    const del = el('button', 'histDel'); del.textContent = '지우기';
    del.onclick = (e) => { e.stopPropagation(); deleteDiscovery(b); };

    row.append(main, del);
    box.appendChild(row);
  }
}

function openDiscovery(b) {
  $('discoveryHome').classList.add('hidden');
  $('discoveryResult').classList.remove('hidden');
  renderDiscoveryCards(b.text);
}

function closeDiscoveryResult() {
  $('discoveryResult').classList.add('hidden');
  $('discoveryHome').classList.remove('hidden');
}
$('discoveryBack').onclick = closeDiscoveryResult;

function renderDiscoveryCards(md) {
  const box = $('discoveryCards');
  box.innerHTML = '';
  for (const c of parseCards(md)) {
    if (!c.title) {
      const f = el('div', 'footnote');
      f.textContent = c.body;
      box.appendChild(f);
      continue;
    }
    const card = el('div', 'dCard');
    if (c.slot) {
      const badge = el('div', 'slotBadge' + (c.slot === '아이디어' ? ' idea' : ''));
      badge.textContent = c.slot;
      card.appendChild(badge);
    }
    const title = el('div', 'dCardTitle'); title.textContent = c.title;
    card.appendChild(title);
    if (c.body) {
      const body = el('div', 'dCardBody');
      body.innerHTML = mdToHtml(c.body);
      card.appendChild(body);
    }
    box.appendChild(card);
  }
}

async function deleteDiscovery(b) {
  if (!confirm('발견을 지울까? 되돌릴 수 없다.')) return;
  discoveryList = discoveryList.filter((x) => x.id !== b.id);
  renderDiscoveryHome();
  const { error } = await sb.schema('rudy').from('utterances').delete().eq('id', b.id);
  if (error) { alert('삭제 실패: ' + error.message); await loadDiscoveryList(); renderDiscoveryHome(); }
}

async function startDiscovery() {
  $('discoveryList').innerHTML = '<div class="empty">불러오는 중…</div>';
  try {
    await loadDiscoveryList();
    renderDiscoveryHome();
  } catch (e) {
    $('discoveryList').innerHTML = `<div class="empty">불러오기 실패: ${e.message ?? e}</div>`;
  }
}

// ---------- 검색 ----------
let searchTimer;
$('search').addEventListener('input', (e) => {
  clearTimeout(searchTimer);
  const v = e.target.value.trim();
  searchTimer = setTimeout(() => { searchTerm = v; refresh(); }, 250);
});

async function refresh() {
  renderFilters();
  try {
    const frs = await loadFragments();
    renderList(frs);
  } catch (e) {
    $('list').innerHTML = `<div class="empty">불러오기 실패: ${e.message ?? e}</div>`;
  }
}

  $('login').style.display = 'none';
  $('app').style.display = 'block';
  await loadProjects();
  renderComposerTags();
  await refresh();
}
